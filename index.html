<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Check-in / Check-out de Cenários</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <div class="header-left">
      <h1>Manutenção de Cenários</h1>
      <p class="subtitle">Registro de Check-in / Check-out</p>
    </div>
    <div class="header-logo">
      <img src="logo_globo corporativa_restrita_branco.png" alt="Globo" class="logo-img" />
    </div>
  </header>
  <div class="barra-colorida-topo"></div>

  <main id="app">

    <!-- TELA INICIAL -->
    <section id="tela-inicio" class="tela ativa">
      <div class="phone-frame">

        <div class="card-opcoes">
          <button class="btn-tipo check-in" onclick="iniciarFormulario('checkin')" aria-label="Check-in">
            <svg width="54" viewBox="0 0 70 56" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="22" width="40" height="30" rx="7"/>
              <path d="M15 22v-6a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4v6"/>
              <circle cx="22" cy="37" r="9"/>
              <line x1="68" y1="12" x2="50" y2="12"/>
              <polyline points="57 6 48 12 57 18"/>
            </svg>
            <span class="btn-tipo-label">CHECK-IN</span>
          </button>
          <button class="btn-tipo check-out" onclick="iniciarFormulario('checkout')" aria-label="Check-out">
            <svg width="54" viewBox="0 0 70 56" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="22" width="40" height="30" rx="7"/>
              <path d="M15 22v-6a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4v6"/>
              <circle cx="22" cy="37" r="9"/>
              <line x1="48" y1="12" x2="66" y2="12"/>
              <polyline points="59 6 68 12 59 18"/>
            </svg>
            <span class="btn-tipo-label">CHECK-OUT</span>
          </button>
        </div>

        <button class="btn-secundario" onclick="verRegistros()">📁 Ver registros salvos</button>

      </div>
    </section>

    <!-- FORMULÁRIO -->
    <section id="tela-formulario" class="tela">
      <div class="topo-form">
        <button class="btn-voltar" onclick="voltarInicio()">← Voltar</button>
        <h2 id="titulo-form">Check-in</h2>
        <span id="badge-tipo" class="badge"></span>
      </div>

      <form id="form-checkin" onsubmit="return false;">

        <div id="busca-checkin" style="display:none;" class="busca-checkin-block">
          <p class="dica" style="margin-bottom:8px;">Opcional: busque o check-in para gerar um relatório completo.</p>
          <div class="busca-row">
            <input type="number" id="busca-numero" placeholder="Nº da reserva..." min="0" />
            <button type="button" class="btn-buscar" onclick="buscarCheckin()">Buscar</button>
          </div>
          <div id="resultado-busca"></div>
        </div>

        <fieldset>
          <legend>Informações da Reserva</legend>
          <label>Cidade Cenográfica *
            <select id="cidade" required onchange="carregarCenarios()">
              <option value="">Selecione a cidade</option>
            </select>
          </label>
          <label>Cenário *
            <select id="cenario" required>
              <option value="">Selecione o cenário</option>
            </select>
          </label>
          <label>Código do Cenário
            <input type="text" id="codigo-cenario" readonly placeholder="Preenchido automaticamente" />
          </label>
          <label>Número da Reserva *
            <input type="number" id="numero-reserva" required placeholder="Ex: 12345" min="0" />
          </label>
          <label>Conteúdo *
            <select id="conteudo" required>
              <option value="">Selecione o conteúdo</option>
            </select>
          </label>
        </fieldset>

        <fieldset>
          <legend>Equipe</legend>
          <label>Supervisor de Montagem *
            <input type="text" id="supervisor" required placeholder="Nome do supervisor" autocomplete="name" />
          </label>
          <label>Engenheiro(a) de Manutenção *
            <select id="engenheiro" required>
              <option value="">Selecione o engenheiro(a)</option>
            </select>
          </label>
        </fieldset>

        <fieldset>
          <legend>Datas</legend>
          <label id="label-data-checkin">Data do Check-in *
            <input type="date" id="data-checkin" required />
          </label>
          <label id="label-data-checkout" style="display:none;">Data do Check-out *
            <input type="date" id="data-checkout" />
          </label>
        </fieldset>

        <fieldset>
          <legend>Observações</legend>
          <label id="label-obs-checkin">Observações gerais
            <textarea id="observacoes" rows="3" placeholder="Condições do cenário, itens com avaria, etc."></textarea>
          </label>
          <label id="label-obs-checkout" style="display:none;">Observações Check-out
            <p class="dica">Toque e segure para selecionar mais de uma opção.</p>
            <select id="observacoes-checkout" multiple size="8">
            </select>
          </label>
        </fieldset>

        <fieldset>
          <legend>Registro Fotográfico <span class="contador-fotos" id="contador">0/30</span></legend>
          <div class="grid-fotos" id="grid-fotos"></div>
          <input type="file" id="input-fotos-multi" accept="image/*" multiple style="display:none" onchange="carregarFotos(event)" />
          <button type="button" class="btn-add-foto" id="btn-add-foto" onclick="document.getElementById('input-fotos-multi').click()">
            📷 Adicionar fotos
          </button>
        </fieldset>

        <div class="acoes-form">
          <button type="button" class="btn-primario" onclick="salvarEGerarRelatorio()">
            📄 Gerar Relatório
          </button>
          <button type="button" class="btn-secundario" onclick="salvarRascunho()">
            💾 Salvar rascunho
          </button>
        </div>

      </form>
    </section>

    <!-- RELATÓRIO -->
    <section id="tela-relatorio" class="tela">
      <div class="topo-form nao-imprime">
        <button class="btn-voltar" onclick="voltarInicio()">← Início</button>
        <h2>Relatório</h2>
        <button class="btn-imprimir" onclick="window.print()">🖨️ Imprimir / PDF</button>
      </div>
      <div id="conteudo-relatorio"></div>
    </section>

    <!-- REGISTROS SALVOS -->
    <section id="tela-registros" class="tela">
      <div class="topo-form">
        <button class="btn-voltar" onclick="voltarInicio()">← Voltar</button>
        <h2>Registros Salvos</h2>
      </div>
      <input type="number" id="busca-registros" class="input-busca-registros" placeholder="Buscar por nº da reserva..." oninput="renderizarRegistros()" />
      <div id="lista-registros"></div>
    </section>

  </main>

  <div class="barra-colorida"></div>

  <script src="dados.js?v=16"></script>
  <script src="app.js?v=14"></script>
</body>
</html>
